<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transmission City — Lead Journey POC</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #07070f;
  overflow: hidden;
  font-family: 'Courier New', Courier, monospace;
  color: #fff;
}

canvas { display: block; }

/* ── Revenue Panel ─────────────────────────────── */
#revenue-panel {
  position: fixed;
  top: 24px; right: 24px;
  padding: 16px 22px;
  background: rgba(245,158,11,.08);
  border: 1px solid rgba(245,158,11,.25);
  border-radius: 10px;
  text-align: right;
  min-width: 160px;
  transition: border-color .4s;
}
#revenue-panel.active { border-color: rgba(245,158,11,.7); }
#revenue-label {
  font-size: 10px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: rgba(245,158,11,.6);
  margin-bottom: 6px;
}
#revenue-value {
  font-size: 30px;
  font-weight: 700;
  color: #F59E0B;
  letter-spacing: -1px;
  transition: color .3s;
}

/* ── Journey Log ───────────────────────────────── */
#journey-log {
  position: fixed;
  left: 24px; top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.log-step {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 10px;
  border-radius: 6px;
  transition: background .3s;
}
.log-step.active { background: rgba(255,255,255,.06); }

.log-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: rgba(255,255,255,.15);
  flex-shrink: 0;
  transition: background .3s, box-shadow .3s;
}
.log-step.active .log-dot {
  background: #fff;
  box-shadow: 0 0 0 3px rgba(255,255,255,.15), 0 0 10px 4px rgba(255,255,255,.25);
}
.log-step.done .log-dot { background: rgba(255,255,255,.45); }

.log-name {
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: rgba(255,255,255,.25);
  transition: color .3s;
}
.log-step.active .log-name { color: rgba(255,255,255,.9); }
.log-step.done  .log-name { color: rgba(255,255,255,.45); }

.log-time {
  font-size: 10px;
  color: rgba(255,255,255,.2);
  margin-left: auto;
  padding-left: 14px;
  transition: color .3s;
}
.log-step.done .log-time { color: rgba(255,255,255,.4); }

/* ── Status Bar ────────────────────────────────── */
#status-bar {
  position: fixed;
  bottom: 28px; left: 50%;
  transform: translateX(-50%);
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 100px;
  padding: 10px 22px;
  font-size: 12px;
  letter-spacing: 1px;
  color: rgba(255,255,255,.65);
  white-space: nowrap;
  transition: opacity .3s, border-color .3s;
  max-width: 90vw;
  text-align: center;
}

/* ── Building Labels ───────────────────────────── */
.blabel {
  position: fixed;
  font-size: 9px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: rgba(255,255,255,.3);
  text-align: center;
  pointer-events: none;
  transform: translateX(-50%);
  white-space: nowrap;
  transition: color .4s, text-shadow .4s;
}
.blabel.lit {
  color: rgba(255,255,255,.85);
  text-shadow: 0 0 12px rgba(255,255,255,.4);
}

/* ── Lead Card ─────────────────────────────────── */
#lead-card {
  position: fixed;
  top: 24px; left: 50%;
  transform: translateX(-50%);
  background: rgba(10,10,20,.85);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 10px;
  padding: 12px 20px;
  font-size: 11px;
  letter-spacing: 1px;
  color: rgba(255,255,255,.7);
  pointer-events: none;
  opacity: 0;
  transition: opacity .4s;
  text-align: center;
  backdrop-filter: blur(8px);
  min-width: 220px;
}
#lead-card.visible { opacity: 1; }
#lead-card-name {
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 4px;
  letter-spacing: 0.5px;
}
#lead-card-sub { opacity: .6; }
#lead-card-elapsed {
  margin-top: 8px;
  font-size: 13px;
  color: #88ccff;
  font-weight: 700;
}

/* ── Hint ──────────────────────────────────────── */
#hint {
  position: fixed;
  bottom: 70px; left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  letter-spacing: 2px;
  color: rgba(255,255,255,.3);
  text-transform: uppercase;
  animation: pulse 2s ease-in-out infinite;
  pointer-events: none;
}
@keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:.7} }
</style>
</head>
<body>

<!-- Revenue -->
<div id="revenue-panel">
  <div id="revenue-label">Revenue Generated</div>
  <div id="revenue-value">$0</div>
</div>

<!-- Journey Log -->
<div id="journey-log">
  <div class="log-step" id="log-capture">
    <div class="log-dot"></div>
    <div class="log-name">Lead Capture</div>
    <div class="log-time" id="t-capture">—</div>
  </div>
  <div class="log-step" id="log-crm">
    <div class="log-dot"></div>
    <div class="log-name">CRM Tower</div>
    <div class="log-time" id="t-crm">—</div>
  </div>
  <div class="log-step" id="log-ai">
    <div class="log-dot"></div>
    <div class="log-name">AI Agent</div>
    <div class="log-time" id="t-ai">—</div>
  </div>
  <div class="log-step" id="log-booking">
    <div class="log-dot"></div>
    <div class="log-name">Booking</div>
    <div class="log-time" id="t-booking">—</div>
  </div>
  <div class="log-step" id="log-revenue">
    <div class="log-dot"></div>
    <div class="log-name">Revenue</div>
    <div class="log-time" id="t-revenue">—</div>
  </div>
</div>

<!-- Lead Card -->
<div id="lead-card">
  <div id="lead-card-name">Sofia R.</div>
  <div id="lead-card-sub">Instagram · Aesthetic Consultation</div>
  <div id="lead-card-elapsed" id="elapsed">0.0s</div>
</div>

<!-- Status -->
<div id="status-bar">Click the glowing particle to begin the lead journey</div>
<div id="hint">↑ click the white sphere</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

/* ═══════════════════════════════════════════════════════
   SCENE SETUP
═══════════════════════════════════════════════════════ */

const W = window.innerWidth, H = window.innerHeight;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07070f);
scene.fog = new THREE.FogExp2(0x07070f, 0.022);

const camera = new THREE.PerspectiveCamera(52, W / H, 0.1, 300);
camera.position.set(2, 14, 34);
const camLookAt = new THREE.Vector3(2, 2, 0);
camera.lookAt(camLookAt);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ═══════════════════════════════════════════════════════
   LIGHTING
═══════════════════════════════════════════════════════ */

scene.add(new THREE.AmbientLight(0x8899bb, 0.55));

const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(15, 25, 12);
sun.castShadow = true;
Object.assign(sun.shadow.camera, { left:-30, right:30, top:20, bottom:-20, near:1, far:80 });
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.bias = -0.001;
scene.add(sun);

const fill = new THREE.DirectionalLight(0x4466aa, 0.3);
fill.position.set(-10, 5, -5);
scene.add(fill);

/* ═══════════════════════════════════════════════════════
   WORLD
═══════════════════════════════════════════════════════ */

// Ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(100, 70),
  new THREE.MeshLambertMaterial({ color: 0x0c0c1a })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Grid
const grid = new THREE.GridHelper(100, 50, 0x141428, 0x141428);
grid.position.y = 0.015;
scene.add(grid);

// Road (connecting all buildings)
function makeLine(pts, color, opacity) {
  const geo = new THREE.BufferGeometry().setFromPoints(
    pts.map(p => new THREE.Vector3(...p))
  );
  const mat = new THREE.LineBasicMaterial({ color, opacity, transparent: true });
  return new THREE.Line(geo, mat);
}
// Central road
scene.add(makeLine([[-16,0.03,0],[21,0.03,0]], 0x1e2a4a, 0.7));
// Dashed center line (3 separate segments for visual)
[-12,-4,4,12].forEach(x => {
  scene.add(makeLine([[x,0.04,0],[x+2,0.04,0]], 0x2a3a6a, 0.4));
});

/* ═══════════════════════════════════════════════════════
   BUILDINGS
═══════════════════════════════════════════════════════ */

const BUILDINGS = [
  { id:'capture', name:'Lead Capture', color:0x0EA5E9, x:-14, h:3.5, w:3.5, d:3.5 },
  { id:'crm',     name:'CRM Tower',   color:0x7C3AED, x:-5,  h:7.0, w:3.5, d:3.5 },
  { id:'ai',      name:'AI Agent',    color:0x06B6D4, x: 3,  h:5.0, w:3.5, d:3.5 },
  { id:'booking', name:'Booking',     color:0x10B981, x:11,  h:4.5, w:3.5, d:3.5 },
  { id:'revenue', name:'Revenue',     color:0xF59E0B, x:19,  h:3.0, w:3.5, d:3.5 },
];

const bMeshes  = {};  // id → Mesh
const bLights  = {};  // id → PointLight
const bLabels  = {};  // id → DOM el
const bVisited = {};  // id → bool

BUILDINGS.forEach(b => {
  // Box
  const geo = new THREE.BoxGeometry(b.w, b.h, b.d);
  const mat = new THREE.MeshLambertMaterial({
    color: b.color,
    emissive: new THREE.Color(b.color).multiplyScalar(0.06),
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(b.x, b.h / 2, 0);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  bMeshes[b.id] = mesh;

  // Edge outline
  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(geo),
    new THREE.LineBasicMaterial({ color: b.color, transparent: true, opacity: 0.25 })
  );
  mesh.add(edges);

  // Rooftop point light (dim by default)
  const pl = new THREE.PointLight(b.color, 0, 12);
  pl.position.set(b.x, b.h + 0.5, 0);
  scene.add(pl);
  bLights[b.id] = pl;

  // DOM label
  const el = document.createElement('div');
  el.className = 'blabel';
  el.id = 'lbl-' + b.id;
  el.textContent = b.name;
  document.body.appendChild(el);
  bLabels[b.id] = el;

  bVisited[b.id] = false;
});

/* ═══════════════════════════════════════════════════════
   LEAD PARTICLE
═══════════════════════════════════════════════════════ */

const leadMat = new THREE.MeshLambertMaterial({
  color: 0xffffff,
  emissive: 0x88bbff,
  emissiveIntensity: 1.2,
});
const lead = new THREE.Mesh(new THREE.SphereGeometry(0.45, 20, 20), leadMat);
lead.castShadow = false;
scene.add(lead);

// Orbit ring
const ring = new THREE.Mesh(
  new THREE.TorusGeometry(0.8, 0.04, 8, 48),
  new THREE.MeshBasicMaterial({ color: 0x88bbff, transparent: true, opacity: 0.55 })
);
ring.rotation.x = Math.PI / 2;
lead.add(ring);

// Lead glow light
const leadLight = new THREE.PointLight(0x88bbff, 3.5, 7);
lead.add(leadLight);

/* ═══════════════════════════════════════════════════════
   CAMERA SYSTEM
═══════════════════════════════════════════════════════ */

const CAM = {
  targetPos:    new THREE.Vector3(2, 14, 34),
  targetLookAt: new THREE.Vector3(2, 2, 0),
};

function setCam(px, py, pz,  lx, ly, lz) {
  CAM.targetPos.set(px, py, pz);
  CAM.targetLookAt.set(lx, ly, lz);
}

/* ═══════════════════════════════════════════════════════
   TWEEN SYSTEM
═══════════════════════════════════════════════════════ */

const tweens = [];

function easeInOut(t) {
  return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
}

function moveTo(obj, tx, ty, tz, dur, onDone) {
  tweens.push({
    obj,
    sx: obj.position.x, sy: obj.position.y, sz: obj.position.z,
    tx, ty, tz,
    dur,
    elapsed: 0,
    onDone,
  });
}

function stepTweens(dt) {
  for (let i = tweens.length - 1; i >= 0; i--) {
    const tw = tweens[i];
    tw.elapsed = Math.min(tw.elapsed + dt, tw.dur);
    const p = easeInOut(tw.elapsed / tw.dur);
    tw.obj.position.set(
      tw.sx + (tw.tx - tw.sx) * p,
      tw.sy + (tw.ty - tw.sy) * p,
      tw.sz + (tw.tz - tw.sz) * p
    );
    if (tw.elapsed >= tw.dur) {
      if (tw.onDone) tw.onDone();
      tweens.splice(i, 1);
    }
  }
}

/* ═══════════════════════════════════════════════════════
   JOURNEY STATE
═══════════════════════════════════════════════════════ */

let journeyActive   = false;
let journeyStart    = 0;
let revenueValue    = 0;
let revenueTarget   = 0;
let revScaleY       = 1;

const statusEl   = document.getElementById('status-bar');
const revEl      = document.getElementById('revenue-value');
const revPanel   = document.getElementById('revenue-panel');
const leadCard   = document.getElementById('lead-card');
const elapsedEl  = document.getElementById('lead-card-elapsed');
const hintEl     = document.getElementById('hint');

function setStatus(txt) {
  statusEl.style.opacity = '0';
  setTimeout(() => { statusEl.textContent = txt; statusEl.style.opacity = '1'; }, 280);
}

function setLog(id, state, time) {
  const el  = document.getElementById('log-' + id);
  const tel = document.getElementById('t-' + id);
  el.className = 'log-step' + (state ? ' ' + state : '');
  if (time !== undefined) tel.textContent = time;
}

function elapsed() {
  return ((Date.now() - journeyStart) / 1000).toFixed(1) + 's';
}

function flashBuilding(id) {
  const b    = BUILDINGS.find(b => b.id === id);
  const mesh = bMeshes[id];
  const pl   = bLights[id];
  const col  = new THREE.Color(b.color);

  mesh.material.emissive.copy(col.clone().multiplyScalar(0.5));
  pl.intensity = 3.5;

  bLabels[id].classList.add('lit');
  bVisited[id] = true;

  setTimeout(() => {
    mesh.material.emissive.copy(col.clone().multiplyScalar(0.18));
    pl.intensity = 1.2;
  }, 500);
}

/* ═══════════════════════════════════════════════════════
   JOURNEY STEPS
═══════════════════════════════════════════════════════ */

// Each step: which building to visit + camera position + camera lookAt + status text
const STEPS = [
  {
    id: 'crm',
    logPrev: 'capture',
    cam: [-10, 10, 20,   -5, 3.5, 0],
    status: 'Lead captured → routing to CRM Tower...',
  },
  {
    id: 'ai',
    cam: [-2, 9, 18,   3, 2.5, 0],
    status: 'CRM updated → AI Agent responding in 0.3s...',
  },
  {
    id: 'booking',
    cam: [ 6, 9, 18,  11, 2.5, 0],
    status: 'AI response sent → booking appointment...',
  },
  {
    id: 'revenue',
    cam: [14, 9, 18,  19, 2.5, 0],
    status: 'Appointment confirmed → revenue generated ✓',
    revenue: 850,
  },
];

let stepIdx = 0;

function runNextStep() {
  if (stepIdx >= STEPS.length) {
    finishJourney();
    return;
  }
  const step = STEPS[stepIdx++];
  const b    = BUILDINGS.find(b => b.id === step.id);

  // Mark previous log as done
  if (step.logPrev) {
    setLog(step.logPrev, 'done', elapsed());
  } else if (stepIdx > 1) {
    setLog(STEPS[stepIdx - 2].id, 'done', elapsed());
  }

  setLog(step.id, 'active', '—');
  setStatus(step.status);
  setCam(...step.cam);

  moveTo(lead, b.x, b.h + 1.1, 0, 1.35, () => {
    flashBuilding(b.id);
    setLog(b.id, 'done', elapsed());

    if (step.revenue) {
      revenueTarget += step.revenue;
      revPanel.classList.add('active');
    }

    setTimeout(runNextStep, 320);
  });
}

function startJourney() {
  if (journeyActive) return;
  journeyActive = true;
  journeyStart  = Date.now();
  stepIdx       = 0;
  hintEl.style.display = 'none';

  // Show lead card
  leadCard.classList.add('visible');

  // Mark capture as active
  setLog('capture', 'active', '—');
  flashBuilding('capture');

  // Brief pause at capture before moving
  setStatus('New lead from Instagram — Sofia R. · Aesthetic Consultation');
  setCam(-14 - 5, 10, 20,   -14, 4, 0);

  setTimeout(() => {
    setLog('capture', 'done', elapsed());
    runNextStep();
  }, 900);
}

function finishJourney() {
  // Pull back to show full city
  setTimeout(() => {
    setCam(2, 18, 40,   2, 3, 0);
    setStatus('Lead → Patient completed in ' + elapsed() + ' · Click the lead to run again');
    leadCard.classList.remove('visible');

    // Reset after delay
    setTimeout(resetJourney, 5500);
  }, 600);
}

function resetJourney() {
  journeyActive = false;
  stepIdx = 0;

  // Reset lead position
  const capture = BUILDINGS[0];
  lead.position.set(capture.x, capture.h + 1.1, 0);

  // Reset logs
  BUILDINGS.forEach(b => {
    setLog(b.id, '', '—');
    bLabels[b.id].classList.remove('lit');
    bLights[b.id].intensity = 0;
    bMeshes[b.id].material.emissive.copy(
      new THREE.Color(b.color).multiplyScalar(0.06)
    );
  });

  // Reset revenue (keep the value as "historical")
  // Actually let's keep it but dim the panel
  revPanel.classList.remove('active');

  setCam(2, 14, 34,   2, 2, 0);
  setStatus('Click the glowing particle to begin the lead journey');
  hintEl.style.display = 'block';
}

/* ═══════════════════════════════════════════════════════
   RAYCASTING / CLICK
═══════════════════════════════════════════════════════ */

const raycaster = new THREE.Raycaster();
const mouse     = new THREE.Vector2();

window.addEventListener('click', e => {
  if (journeyActive) return;
  mouse.x =  (e.clientX / innerWidth)  * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  if (raycaster.intersectObject(lead).length) startJourney();
});

window.addEventListener('mousemove', e => {
  if (journeyActive) return;
  mouse.x =  (e.clientX / innerWidth)  * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  renderer.domElement.style.cursor =
    raycaster.intersectObject(lead).length ? 'pointer' : 'default';
});

/* ═══════════════════════════════════════════════════════
   DOM LABEL POSITIONING
═══════════════════════════════════════════════════════ */

const _v = new THREE.Vector3();

function updateLabels() {
  BUILDINGS.forEach(b => {
    _v.set(b.x, b.h + 1.2, 0);
    _v.project(camera);
    const x = (_v.x *  0.5 + 0.5) * innerWidth;
    const y = (_v.y * -0.5 + 0.5) * innerHeight;
    const el = bLabels[b.id];
    el.style.left = x + 'px';
    el.style.top  = (y + 10) + 'px';
    el.style.display = _v.z > 1 ? 'none' : 'block';
  });
}

/* ═══════════════════════════════════════════════════════
   ANIMATION LOOP
═══════════════════════════════════════════════════════ */

const clock = new THREE.Clock();
let t = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  t = clock.getElapsedTime();

  // Tweens
  stepTweens(dt);

  // Smooth camera
  camera.position.lerp(CAM.targetPos, 0.038);
  camLookAt.lerp(CAM.targetLookAt, 0.038);
  camera.lookAt(camLookAt);

  // Lead idle animation
  if (!journeyActive && tweens.length === 0) {
    const base = BUILDINGS[0];
    lead.position.set(
      base.x,
      base.h + 1.1 + Math.sin(t * 1.8) * 0.14,
      0
    );
    leadMat.emissiveIntensity = 0.9 + Math.sin(t * 2.8) * 0.5;
  } else {
    leadMat.emissiveIntensity = 1.4;
  }

  // Ring + lead light
  ring.rotation.z = t * 0.9;
  leadLight.intensity = 2.8 + Math.sin(t * 4.5) * 1.0;

  // Revenue counter smooth roll
  if (revenueValue < revenueTarget) {
    revenueValue += (revenueTarget - revenueValue) * 0.06 + 1.5;
    if (revenueValue > revenueTarget) revenueValue = revenueTarget;
    revEl.textContent = '$' + Math.round(revenueValue).toLocaleString();
  }

  // Revenue building grows
  if (revenueTarget > 0) {
    const rb   = BUILDINGS[4];
    const mesh = bMeshes.revenue;
    const targetScale = 1 + (revenueValue / revenueTarget) * 1.1;
    revScaleY += (targetScale - revScaleY) * 0.025;
    mesh.scale.y = revScaleY;
    mesh.position.y = (rb.h * revScaleY) / 2;
  }

  // Update lead card elapsed time
  if (journeyActive) {
    elapsedEl.textContent = elapsed();
  }

  // Update DOM labels
  updateLabels();

  renderer.render(scene, camera);
}

// Init lead position
lead.position.set(BUILDINGS[0].x, BUILDINGS[0].h + 1.1, 0);

animate();
</script>
</body>
</html>
